<!doctype html><meta charset="utf-8"><title>PMS 完整响应采集</title>
<style>body{font:14px system-ui;margin:12px;background:#f8fafc}label{display:inline-flex;gap:6px;align-items:center;margin:4px}input,select,button{font:inherit;padding:7px;border:1px solid #cbd5e1;border-radius:5px}button{cursor:pointer;background:white}iframe{display:block;border:0;background:white;width:1366px;height:768px;margin-top:10px}pre{white-space:pre-wrap;max-height:240px;overflow:auto;background:white;padding:12px}input{width:240px}#spec{width:850px}#result{font-weight:600}</style>
<h1>PMS 完整响应采集</h1><p>隔离本地生产预览。所有操作由真实界面触发；响应包含内容、可见对应图片、字体与两次绘制，保存包含事务完成和独立持久读取。无超时删样本、无结果填 0。</p>
<label>路径<input id="route" value="/pms/product-purchase-orders"></label><button id="load">加载页面</button><button id="reload">刷新页面</button><label>视口<select id="size"><option>1366×768</option><option>1280×720</option></select></label><br>
<label>采样名称<input id="label" value="页面加载"></label><label>操作定义 JSON<input id="spec" value='{"selector":"[data-standard-list-page]","text":"","event":"click"}'></label><button id="arm">记录下一操作</button><button id="download">导出采样</button><span id="result">准备完成</span>
<iframe id="app" title="实际采购原型"></iframe><pre id="results">[]</pre>
<script>
const frame=document.querySelector('#app'), output=document.querySelector('#results'), status=document.querySelector('#result');
let samples=[], armed=null, active=null, mutationSerial=0, completedWrites=0, generatedFiles=[];
const now=()=>performance.now();
const paint=async w=>{await w.document.fonts.ready;await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)))};
const visible=el=>{if(!el?.isConnected)return false;const box=el.getBoundingClientRect(),style=el.ownerDocument.defaultView.getComputedStyle(el);return box.width>0&&box.height>0&&style.visibility!=='hidden'&&style.display!=='none'};
const readStore=async name=>{const w=frame.contentWindow;return new Promise((resolve,reject)=>{const req=w.indexedDB.open('higood-pms');req.onerror=()=>reject(req.error);req.onsuccess=()=>{const db=req.result;if(!db.objectStoreNames.contains(name)){db.close();reject(Error('持久目标不存在'));return}const tx=db.transaction(name,'readonly'),q=tx.objectStore(name).getAll();let rows;q.onsuccess=()=>rows=q.result;tx.oncomplete=()=>{db.close();resolve(rows)};tx.onerror=()=>{db.close();reject(tx.error)}}})};
function finish(sample, error) {if(active!==sample)return;active=null;const elapsed=now()-sample.start;const row={label:sample.label,route:frame.contentWindow.location.pathname,event:sample.event,viewport:[Number(frame.width),Number(frame.height)],start:sample.start,elapsedMs:elapsed,result:error?'采集无效':elapsed>1000?'超时':'通过',error:error?.message??null,persistentRows:sample.persistentRows??null,generatedFile:sample.generatedFile??null,visibleImages:sample.visibleImages??null,shellPreserved:sample.navigation?null:frame.contentDocument.querySelector('aside')===sample.sidebar,readableText:sample.readableText??null,layout:sample.layout??null,finishedAt:new Date().toISOString()};samples.push(row);output.textContent=JSON.stringify(samples,null,2);output.dataset.samples=String(samples.length);status.textContent=row.result+' '+elapsed.toFixed(2)+'ms'}
async function check(sample) {
 if(active!==sample||sample.checking)return;
 const w=frame.contentWindow,d=w.document;let node;
 try{node=d.querySelector(sample.spec.selector)}catch(error){finish(sample,error);return}
 const menusReady=[...d.querySelectorAll('aside button[data-menu-group-header],aside button[data-tab-href]')].every(menu=>menu.querySelector('svg'));
 if(!visible(node)||!menusReady||sample.spec.text&&!node.textContent.includes(sample.spec.text)||sample.spec.absent&&d.querySelector(sample.spec.absent)||!sample.navigation&&!sample.spec.noMutationExpected&&mutationSerial<=sample.mutation||sample.spec.commit&&completedWrites<=sample.writes){w.requestAnimationFrame(()=>check(sample));return}
 if(sample.spec.fileGenerated&&generatedFiles.length<=sample.files){w.requestAnimationFrame(()=>check(sample));return}
 sample.checking=true;
 try {
  if(!sample.spec.allowImageError&&[...d.querySelectorAll('[data-pms-image-error], [data-pms-preview-error]')].some(visible))throw Error('实际实物图片加载失败');
  const imgs=[...d.images].filter(img=>visible(img)&&img.getBoundingClientRect().top<w.innerHeight&&img.getBoundingClientRect().bottom>0);
  await Promise.all(imgs.map(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true})});if(img.naturalWidth>0)await img.decode().catch(()=>{});else if(!sample.spec.allowImageError)throw Error('目标实物图片未就绪')}));
  if(sample.spec.readStore){const rows=await readStore(sample.spec.readStore);if(sample.spec.readKey&&!rows.some(row=>row[sample.spec.keyField||'id']===sample.spec.readKey))throw Error('保存结果无法独立读回');sample.persistentRows=rows.length}
  if(sample.spec.fileGenerated)sample.generatedFile=generatedFiles.at(-1);
  sample.visibleImages=imgs.length;sample.readableText=node.textContent.slice(0,500);await paint(w);sample.layout={h1:d.querySelector('main h1')?.textContent.trim()??null,viewport:w.innerWidth,pageWidth:d.documentElement.scrollWidth,bodyWidth:d.body.scrollWidth,mainWidth:d.querySelector('main')?.getBoundingClientRect().width??null,menu:[...d.querySelectorAll('aside button[data-menu-group-header],aside button[data-tab-href]')].map(e=>({title:e.textContent.trim(),iconCount:e.querySelectorAll('svg').length,href:e.dataset.tabHref??null})),footer:d.querySelector('main')?.innerText.slice(-400)??'',tables:[...d.querySelectorAll('[data-standard-list-scroll]')].map(e=>({width:e.clientWidth,scroll:e.scrollWidth}))};finish(sample);
 }catch(error){finish(sample,error)}
}
function install() {
 const w=frame.contentWindow,d=w.document;
 const createObjectURL=w.URL.createObjectURL;w.URL.createObjectURL=function(blob){if(blob instanceof w.Blob)generatedFiles.push({size:blob.size,type:blob.type,at:now()});return createObjectURL.call(w.URL,blob)};
 const transact=w.IDBDatabase.prototype.transaction;
 w.IDBDatabase.prototype.transaction=function(...args){const tx=transact.apply(this,args);if(args[1]==='readwrite')tx.addEventListener('complete',()=>{completedWrites++;if(active)check(active)});return tx};
 new w.MutationObserver(()=>{mutationSerial++;if(active)check(active)}).observe(d.documentElement,{subtree:true,childList:true,attributes:true,characterData:true});
 for(const type of ['click','input','change','keydown'])d.addEventListener(type,event=>{
   if(!armed||armed.spec.event!==type)return;
   if(armed.spec.key&&event.key!==armed.spec.key)return;
   if(armed.spec.trigger&&!event.target.closest(armed.spec.trigger))return;
   const start=performance.now()-(w.performance.now()-event.timeStamp);
   active={...armed,event:type,start,mutation:mutationSerial,writes:completedWrites,files:generatedFiles.length,sidebar:d.querySelector('aside'),focus:event.target};armed=null;status.textContent='正在等待完整结果';const current=active;setTimeout(()=>{if(active===current)finish(current,Error('完整结果在15秒内未就绪'))},15000);check(current);
 },true);
 if(active?.navigation)check(active);
}
frame.onload=install;
function navigate(refresh) {
 const label=document.querySelector('#label').value,route=document.querySelector('#route').value;
 if(!route.startsWith('/pms/'))throw Error('仅允许本机PMS路径');
 active={label,event:refresh?'refresh':'navigation',start:now(),navigation:true,spec:{selector:'[data-standard-list-page]',text:'',allowImageError:false},mutation:0,writes:0};
 status.textContent='正在加载实际页面';const current=active;setTimeout(()=>{if(active===current)finish(current,Error('导航在15秒内未就绪'))},15000);
 if(refresh)frame.contentWindow.location.reload();else frame.src=route;
}
document.querySelector('#load').onclick=()=>navigate(false);document.querySelector('#reload').onclick=()=>navigate(true);
document.querySelector('#size').onchange=event=>{const [width,height]=event.target.value.split('×').map(Number);frame.width=width;frame.height=height;frame.style.width=width+'px';frame.style.height=height+'px'};
frame.width=1366;frame.height=768;
document.querySelector('#arm').onclick=()=>{try{const spec=JSON.parse(document.querySelector('#spec').value);if(!spec.selector)throw Error('缺少结果选择器');armed={label:document.querySelector('#label').value,spec};status.textContent='已准备，等待实际界面操作'}catch(error){status.textContent=error.message}};
document.querySelector('#download').onclick=()=>{const blob=new Blob([JSON.stringify({environment:{origin:location.origin,userAgent:navigator.userAgent,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,fixture:'actual iframe event→content/images/fonts→two rAF; save readonly readback'},samples},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pms-performance-samples.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script>

<!doctype html><meta charset="utf-8"><title>采购本地资料隔离验收</title><link rel="stylesheet" href="/src/styles.css">
<style>body{font:16px sans-serif;line-height:1.6;padding:24px}button{padding:10px;margin:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>采购本地资料隔离验收</h1><p>仅在任务独占的本机 5254 端口准备 CHECK 记录；不清库，不操作测试站或正式环境。性能记录只监听人工点击真实资料面板的迁移按钮。</p>
<button id="seed">准备五条旧采购记录</button><button id="panel">打开采购本地资料</button><button id="read">独立读取迁移结果</button><button id="conflict">准备旧源冲突记录</button><button id="failure">模拟本次旧键清理失败</button><button id="read-conflict">独立读取冲突保护结果</button><button id="read-kernel">独立读取核心资料与附件字节</button><pre id="output">尚未准备记录，未执行迁移</pre>
<h2>真实按钮事件性能记录</h2><pre id="performance" data-samples>尚无实际点击样本</pre><h2>核心资料只读回读</h2><pre id="kernel" data-kernel-summary>尚未回读；在真实面板选择备份后，可独立核对记录及附件原字节</pre>
<script type="module">
import { openPmsStoragePanel } from '/src/components/pms-storage-panel.ts';

const output=document.querySelector('#output'), performanceOutput=document.querySelector('#performance'), kernelOutput=document.querySelector('#kernel');
const groups=['normal','correct-conflict','cleanup-failure','retry'];
const samples=[], preparations=[], session=crypto.randomUUID().slice(0,8);let round=0, context=null, active=null, restoreRemove=null, selectedBackup=null, backupError='', restoreObservation=null;
const spec={origin:'http://127.0.0.1:5254 (also localhost:5254)',start:'capture-phase trusted click on enabled [data-storage-action="legacy-migrate"]',trigger:'Actual UI pointer clicks the real product panel button; fixture never clicks or invokes migrate/restore',result:'MutationObserver waits for changed nonempty [data-storage-result] and re-enabled clicked button in the same real panel',complete:'Independent pmsGet/pmsAll/legacy-key checks; then document.fonts.ready and two requestAnimationFrame callbacks',timeoutMs:15000,requiredValidSamplesPerGroup:5,groups:{normal:'5 unique missing records, complete contents/version/receipt/log verified; old key removed', 'correct-conflict':'changed first target unchanged, second target still absent, entire source unchanged; no receipt/log/version write', 'cleanup-failure':'one scoped removeItem throws; all 5 targets saved/verified, source unchanged, single receipt/log',retry:'same source retry removes old key; same 5 target values/versions, no extra target/receipt/log'},boundaries:['No product source or storage-kernel changes','Only explicitly prepared CGF-CHECK-* records may be written; only owned legacy raw may be replaced','No clear(), deleteDatabase(), record deletion, automated product click or automatic business initialization','A correct conflict/cleanup failure is valid expected business failure; timeout or mismatched readback is invalid','Core summary is independent read-only observation; backup restore passes only after matching original selected bytes and all source rows']};
const canonical=value=>Array.isArray(value)?value.map(canonical):value&&typeof value==='object'?Object.fromEntries(Object.entries(value).filter(([key])=>!['_baseVersion','_pmsBaseVersion'].includes(key)).sort(([a],[b])=>a.localeCompare(b)).map(([key,item])=>[key,canonical(item)])):value;

function isolated(){if(location.protocol!=='http:'||!['127.0.0.1','localhost'].includes(location.hostname)||location.port!=='5254')throw Error('本夹具只允许任务独占本机 5254 端口；当前来源不允许准备或核验');}

function performanceReport(){const summary=Object.fromEntries(groups.map(group=>{const all=samples.filter(sample=>sample.group===group), valid=all.filter(sample=>sample.valid);return[group,{required:5,attempted:all.length,valid:valid.length,invalid:all.length-valid.length,validFailures:valid.filter(sample=>sample.expectedBusinessFailure).length,maximumMs:valid.length?Math.max(...valid.map(sample=>sample.totalMs)):null,maximumObservedMs:all.length?Math.max(...all.map(sample=>sample.totalMs)):null,ready:valid.length>=5}]}));const report={spec,origin:location.origin,summary,totalSamples:samples.length,allGroupsReady:groups.every(group=>summary[group].ready),active:active?{group:active.group,startedAt:active.startedAt}:null,preparations,samples};const json=JSON.stringify(report,null,2);performanceOutput.textContent=json;performanceOutput.dataset.samples=json;performanceOutput.dataset.ready=String(report.allGroupsReady);return report;}
async function snapshot(){const [orders,logs,receipts,versions]=await Promise.all([pmsAll(PMS_STORES.pmsMaterialPurchaseOrderDeltas),pmsAll(PMS_STORES.pmsOperationLogs),pmsAll(PMS_STORES.pmsCommittedOperations),pmsAll(PMS_STORES.pmsVersionSnapshots)]);return{orders,logs,receipts,versions};}

async function ownedSource(){const raw=localStorage.getItem(PMS_LEGACY_MPO_KEY);if(raw===null)return null;let rows;try{rows=JSON.parse(raw)}catch{throw Error('当前旧源格式无法核对，停止准备且保留原值');}if(!Array.isArray(rows)||rows.some(row=>!row?.purchaseOrderNo?.startsWith('CGF-CHECK-')))throw Error('已有非本次验收旧资料，停止准备且保留原值');const targets=await Promise.all(rows.map(row=>pmsGet(PMS_STORES.pmsMaterialPurchaseOrderDeltas,row.purchaseOrderNo)));return{raw,sourceHash:await hash(raw),count:rows.length,targets:targets.map((row,index)=>({id:rows[index].purchaseOrderNo,saved:!!row,remark:row?.remark,version:row?._pmsBaseVersion,contentMatches:!!row&&stable(row)===stable(rows[index])}))};}
const order=id=>({...structuredClone(getPmsMaterialPurchaseOrder('CGF-2026-0001')),purchaseOrderNo:id,remark:'CHECK 迁移验证',_pmsBaseVersion:0});
async function prepare(kind){isolated();if(active)throw Error('当前按钮事件尚未回读完成，等待性能记录结束');if(restoreRemove)throw Error('一次清理失败尚未触发，先完成该次实际点击');const residual=await ownedSource();if(context?.kind==='retry'&&residual?.raw===context.source)throw Error('上一轮目标已保存但旧源未清理，先点击真实迁移按钮重试，不覆盖待清理源');const prefix=`CGF-CHECK-${session}-${++round}`, ids=Array.from({length:kind==='correct-conflict'?2:5},(_,index)=>`${prefix}-${index+1}`);const rows=ids.map(order);if((await Promise.all(ids.map(id=>pmsGet(PMS_STORES.pmsMaterialPurchaseOrderDeltas,id)))).some(Boolean))throw Error('本轮单号已存在，未准备旧源');if(kind==='correct-conflict')await pmsCommitRecords([{store:PMS_STORES.pmsMaterialPurchaseOrderDeltas,value:{...rows[0],remark:'CHECK 目标已修改'}}]);const source=JSON.stringify(rows), sourceHash=await hash(source);const before=await snapshot();localStorage.setItem(PMS_LEGACY_MPO_KEY,source);localStorage.setItem('CHECK-pms-preserve','保留其他键');context={kind,ids,rows,source,sourceHash,operationId:`pms-legacy-mpo:${sourceHash}`,logId:`PMSLOG-MIGRATION-${sourceHash}`,before,failureTriggered:false};preparations.push({round,kind,ids,sourceHash,priorOwnedSource:residual,priorRecordedRounds:preparations.map(item=>({round:item.round,kind:item.kind,targets:item.ids.map(id=>{const saved=before.orders.find(row=>row.purchaseOrderNo===id);return{id,saved:!!saved,remark:saved?.remark,version:saved?._pmsBaseVersion}})})),before:counts(before)});show({prepared:kind,ids,count:rows.length,priorOwnedSource:residual,message:kind==='correct-conflict'?'首目标已明确写入冲突值；第二目标未保存。真实迁移应阻断整批并保留旧源':'五条新的旧采购记录已准备，尚未执行迁移；通过真实资料面板操作'});performanceReport();}

avedValuesAndVersions:saved.every((row,index)=>JSON.stringify(row)===JSON.stringify(ctx.before.orders.find(item=>item.purchaseOrderNo===ctx.ids[index])))});else Object.assign(checks,{sourceRemoved:raw===null,exactDelta:afterCounts.orders===beforeCounts.orders+ctx.rows.length&&afterCounts.logs===beforeCounts.logs+1&&afterCounts.receipts===beforeCounts.receipts+1});}const valid=Object.values(checks).every(Boolean);return{valid,kind,expectedBusinessOutcome:spec.groups[kind],checks,before:beforeCounts,after:afterCounts,sourceRetained:raw!==null,sourceUnchanged:raw===ctx.source,receiptCount:associatedReceipts.length,migrationLogCount:associatedLogs.length,saved:await Promise.all(saved.map(async(row,index)=>({id:ctx.ids[index],saved:!!row,remark:row?.remark,version:row?._pmsBaseVersion,contentHash:row?await hash(stable(row)):null,expectedHash:await hash(stable(ctx.rows[index]))}))),snapshot:after};}
function waitForResult(button,panel,initialText){return new Promise((resolve,reject)=>{const region=panel.querySelector('[data-storage-result]');if(!region){reject(Error('真实面板没有结果区域'));return}const observer=new MutationObserver(()=>{const text=region.textContent.trim();if(text&&text!==initialText&&!button.disabled){cleanup();resolve({text,resultAt:performance.now()})}});const timer=setTimeout(()=>{cleanup();reject(Error('等待真实结果和按钮可用超时'))},spec.timeoutMs);const cleanup=()=>{clearTimeout(timer);observer.disconnect()};observer.observe(panel,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['disabled']});});}

document.addEventListener('click',event=>{const button=event.target instanceof Element?event.target.closest('[data-storage-action="legacy-migrate"]'):null;if(!(button instanceof HTMLButtonElement)||button.disabled)return;const start=performance.now(), startedAt=new Date().toISOString(), ctx=context, group=ctx?.kind??'unprepared';const panel=button.closest('[role="dialog"]');const sample={index:samples.length+1,group,startedAt,triggerTrusted:event.isTrusted,startMs:start,ids:ctx?.ids??[],sourceHash:ctx?.sourceHash??null,expectedBusinessFailure:['correct-conflict','cleanup-failure'].includes(group)};if(active||!ctx||!event.isTrusted||!panel){samples.push({...sample,valid:false,totalMs:performance.now()-start,error:active?'上个采样尚未结束':!ctx?'没有独立准备的验收源':!event.isTrusted?'不是实际用户按钮事件':'按钮不在真实面板'});performanceReport();return}try{isolated()}catch(error){samples.push({...sample,valid:false,totalMs:performance.now()-start,error:error.message});performanceReport();return}active={group,startedAt};performanceReport();const initialText=panel.querySelector('[data-storage-result]')?.textContent.trim()??'';const terminal=waitForResult(button,panel,initialText);deadline((async()=>{const result=await terminal;ctx.lastTerminalResult={group,text:result.text,at:result.resultAt};const readback=await verify(ctx,group);const readbackAt=performance.now();await document.fonts.ready;await twoFrames();return{result,readback,readbackAt,end:performance.now()}})()).then(({result,readback,readbackAt,end})=>{const {snapshot:after,...publicReadback}=readback;const resultMatches=group==='correct-conflict'?/冲突/.test(result.text):group==='cleanup-failure'?/目标已保存/.test(result.text)&&/未清理/.test(result.text):/已核对/.test(result.text)&&/清理/.test(result.text);const valid=readback.valid&&resultMatches&&end>start;samples.push({...sample,valid,totalMs:end-start,resultMs:result.resultAt-start,readbackMs:readbackAt-start,renderStableMs:end-start,resultText:result.text,resultMatches,readback:publicReadback});if(group= document.querySelector('#seed').onclick=()=>prepare('normal').catch(error=>show(error.message,false));
document.querySelector('#conflict').onclick=()=>prepare('correct-conflict').catch(error=>show(error.message,false));
document.querySelector('#panel').onclick=()=>{try{isolated();openPmsStoragePanel().catch(error=>show(error.message,false))}catch(error){show(error.message,false)}};
document.querySelector('#read').onclick=async()=>{try{if(!context||active)throw Error('先准备且完成真实按钮事件，再独立回读');const pendingRetry=context.kind==='retry'&&localStorage.getItem(PMS_LEGACY_MPO_KEY)!==null;const readingContext=pendingRetry?context.failedAttemptContext:context;const kind=pendingRetry?'cleanup-failure':context.kind;if(readingContext?.lastTerminalResult?.group!==kind)throw Error('尚未收到本组真实迁移按钮的结果，准备状态不能判定迁移通过');const {snapshot:ignored,...result}=await verify(readingContext,kind);show(result,result.valid)}catch(error){show(error.message,false)}};
document.querySelector('#read-conflict').onclick=async()=>{try{if(context?.kind!=='correct-conflict'||active||context.lastTerminalResult?.group!=='correct-conflict')throw Error('当前不是已收到真实按钮结果的冲突场景');const{snapshot:ignored,...result}=await verify(context,'correct-conflict');show(result,result.valid)}catch(error){show(error.message,false)}};
document.querySelector('#failure').onclick=()=>{try{isolated();if(context?.kind!=='normal'||active||restoreRemove)throw Error('先准备新的五条旧源；每轮只允许拦截一次清理');if(localStorage.getItem(PMS_LEGACY_MPO_KEY)!==context.source)throw Error('旧源已变化，未安装模拟故障');const ctx=context,original=Storage.prototype.removeItem;restoreRemove=()=>{Storage.prototype.removeItem=original;restoreRemove=null};Storage.prototype.removeItem=function(key){if(key===PMS_LEGACY_MPO_KEY){restoreRemove();if(localStorage.getItem(key)!==ctx.source)throw Error('CHECK 旧源已变化，阻止误清理');ctx.failureTriggered=true;throw Error('CHECK 本次清理被阻止')}return original.call(this,key)};ctx.kind='cleanup-failure';show('已安装一次、仅此旧键的清理故障；通过真实迁移按钮触发。结果回读后，再点真实按钮采集重试。');performanceReport()}catch(error){show(error.message,false)}};
addEventListener('beforeunload',()=>restoreRemove?.());
async function inspectBackup(file){isolated();if(file.size<12||file.size>128*1024*1024)throw Error('备份尺寸不符，未建立字节核对源');const header=new Uint8Array(await file.slice(0,12).arrayBuffer());if(new TextDecoder().decode(header.slice(0,8))!=='HGPMS001')throw Error('不是 HGPMS001 原始备份，未建立恢复核对源');const size=new DataView(header.buffer).getUint32(8,true);if(size>file.size-12)throw Error('备份清单长度越界');const manifest=JSON.parse(await file.slice(12,12+size).text());if(manifest.format!=='higood-pms'||!Array.isArray(manifest.stores))throw Error('备份清单格式不符');selectedBackup={file,manifest,payloadAt:12+size,selectedAt:new Date().toISOString()};backupError='';restoreObservation=null;kernelOutput.textContent=JSON.stringify({fileName:file.name,fileBytes:file.size,sourceRows:manifest.stores.reduce((sum,entry)=>sum+entry.records.length,0),sourceAttachments:manifest.stores.find(entry=>entry.store===PMS_STORES.pmsAttachments)?.records.length??0,message:'仅独立读取所选原备份，尚未声明恢复通过；实际恢复由真实资料面板按钮执行'},null,2);}
document.addEventListener('change',event=>{if(event.target instanceof HTMLInputElement&&event.target.hasAttribute('data-storage-file')&&event.target.files?.[0]){selectedBackup=null;inspectBackup(event.target.files[0]).catch(error=>{backupError=error.message;kernelOutput.textContent=error.message})}},true);
document.addEventListener('click',event=>{const button=event.target instanceof Element?event.target.closest('[data-storage-action="restore"]'):null;if(!(button instanceof HTMLButtonElement)||button.disabled||!event.isTrusted)return;try{isolated();const panel=button.closest('[role="dialog"]');if(!panel)return;restoreObservation={trusted:true,clickedAt:new Date().toISOString(),sourceName:selectedBackup?.file.name??null,pending:true};waitForResult(button,panel,panel.querySelector('[data-storage-result]')?.textContent.trim()??'').then(result=>{restoreObservation={...restoreObservation,pending:false,resultText:result.text,resultObservedAt:new Date().toISOString()}}).catch(error=>{restoreObservation={...restoreObservation,pending:false,invalid:true,error:error.message}})}catch(error){restoreObservation={invalid:true,error:error.message}}},true);
document.querySelector('#read-kernel').onclick=async()=>{try{isolated();const actual=await Promise.all(Object.values(PMS_STORES).map(async store=>({store,rows:await pmsAll(store)})));const rowValues=await Promise.all(actual.map(async entry=>({store:entry.store,count:entry.rows.length,rows:await Promise.all(entry.rows.map(async row=>{if(entry.store!==PMS_STORES.pmsAttachments)return row;const{blob,...meta}=row;return{...meta,blob:blob instanceof Blob?{type:blob.type,size:blob.size,sha256:await hash(await blob.arrayBuffer())}:{missing:true}}}))})));const matches=[];if(selectedBackup)for(const entry of selectedBackup.manifest.stores){const target=actual.find(item=>item.store===entry.store);if(!target)throw Error(`备份包含当前内核不认识的仓库 ${entry.store}`);for(const sourceRow of entry.records){if(entry.store!==PMS_STORES.pmsAttachments){matches.push({store:entry.store,sourceValue:sourceRow,matched:target.rows.some(row=>JSON.stringify(row)===JSON.stringify(sourceRow))});continue}const{backupOffset,backupLength,...meta}=sourceRow;const targetFile=target.rows.find(row=>row.id===meta.id);const offset=Number(backupOffset), length=Number(backupLength);const rangeValid=Number.isSafeInteger(offset)&&Number.isSafeInteger(length)&&offset>=0&&length>=0&&selectedBackup.payloadAt+offset+length<=selectedBackup.file.size;const originalBytes=rangeValid?new Uint8Array(await selectedBackup.file.slice(selectedBackup.payloadAt+offset,selectedBackup.payloadAt+offset+length).arrayBuffer()):null;const restoredBytes=targetFile?.blob instanceof Blob?new Uint8Array(await targetFile.blob.arrayBuffer()):null;const bytesEqual=!!originalBytes&&!!restoredBytes&&originalBytes.length===restoredBytes.length&&originalBytes.every((byte,index)=>byte===restoredBytes[index]);const{blob:ignored,...actualMeta}=targetFile??{};matches.push({store:entry.store,id:meta.id,sourceMeta:meta,restoredMeta:actualMeta,sourceBytes:originalBytes?.length??null,restoredBytes:restoredBytes?.length??null,sourceSha256:originalBytes?await hash(originalBytes):null,restoredSha256:restoredBytes?await hash(restoredBytes):null,rangeValid,bytesEqual,matched:bytesEqual&&JSON.stringify(meta)===JSON.stringify(actualMeta)});}}const result={boundary:'核心存储内核未改；只读当前目标记录。附件核验直接比较所选原备份字节与持久 Blob，未选择源时只报告观察、不宣称恢复通过。',sourceBackup:selectedBackup?{name:selectedBackup.file.name,size:selectedBackup.file.size,selectedAt:selectedBackup.selectedAt,formatVersion:selectedBackup.manifest.formatVersion,databaseVersion:selectedBackup.manifest.databaseVersion}:null,sourceReadError:backupError||null,actualRestoreObservation:restoreObservation,targetCounts:Object.fromEntries(actual.map(entry=>[entry.store,entry.rows.length])),matchedRows:matches.filter(item=>item.matched).length,sourceRows:matches.length,recordContentsVerified:!!selectedBackup&&matches.length>0&&matches.every(item=>item.matched),restorationVerified:!!selectedBackup&&matches.length>0&&matches.every(item=>item.matched)&&restoreObservation?.trusted===true&&!restoreObservation.pending&&!restoreObservation.invalid&&/已恢复/.test(restoreObservation.resultText??''),matches,rowValues};const json=JSON.stringify(result,null,2);kernelOutput.textContent=json;kernelOutput.dataset.kernelSummary=json;kernelOutput.dataset.result=selectedBackup&&restoreObservation?(result.restorationVerified?'passed':'failed'):'observed';}catch(error){kernelOutput.textContent=error.message;kernelOutput.dataset.result='failed'}};

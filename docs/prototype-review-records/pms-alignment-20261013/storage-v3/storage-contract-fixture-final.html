<!doctype html><meta charset="utf-8"><title>采购保存隔离检查</title><style>body{font:16px sans-serif;margin:30px;line-height:1.6}button{padding:12px;margin:6px}pre{white-space:pre-wrap} .pass{color:green}.fail{color:#b00}</style><h1>采购保存隔离检查</h1><p>仅使用本机隔离端口、CHECK 前缀验证记录，不读取或清除其他浏览器域的数据。</p><button id="run">运行保存契约检查</button><button id="read">关闭连接并重新读取</button><button id="upgrade">验证旧库升级和阻塞恢复</button><button id="backup">验证完整备份和冲突保护</button><button id="transfer">准备在另一隔离域恢复</button><button id="restore" disabled>恢复收到的验证备份</button><div id="target"></div><pre id="results">准备完成</pre><script type="module">
import {exportPmsDataBundle,importPmsDataBundle,PMS_IDB_VERSION,PMS_IDB_DB_NAME,PMS_STORES as S,pmsCommitRecords,pmsGet,pmsAll,pmsTx,pmsPut,closePmsDb,getPmsDb} from '/src/data/pms/idb-storage.ts';
import {listPmsLogs} from '/src/data/pms/runtime.ts';
const output=document.querySelector('#results');let report=[];const uid='CHECK-'+crypto.randomUUID();let savedId='';
const log={objectType:'保存隔离检查',objectId:uid,action:'验证原子保存',beforeValue:'',afterValue:'2条',reason:'本机验证',actorId:'CHECK',actorName:'验证代理',actorRole:'系统'};
const test=async(name,fn)=>{try{await fn();report.push({name,result:'通过'})}catch(e){report.push({name,result:'失败',message:e.message})}output.textContent=JSON.stringify(report,null,2)};
const assert=(p,m)=>{if(!p)throw Error(m)};
document.querySelector('#run').onclick=async()=>{report=[];document.querySelector('#run').disabled=true; const main={id:uid,qty:10}; const file={id:uid+'-file',name:'check.txt',type:'text/plain',size:4,blob:new Blob(['TEST'],{type:'text/plain'})};
await test('主记录/日志/附件同事务保存与独立读回',async()=>{await pmsCommitRecords([{store:S.pmsCommittedOperations,value:main}],{log,operationId:uid+'-operation',attachments:[file],attachmentReferences:[{store:S.pmsCommittedOperations,key:uid,fileIds:[file.id]}]});assert(main._pmsBaseVersion===1,'未更新完成版本');assert((await pmsGet(S.pmsCommittedOperations,uid)).qty===10,'主记录缺失');assert(await (await pmsGet(S.pmsAttachments,file.id)).blob.text()==='TEST','Blob不一致');assert(listPmsLogs(log.objectType,uid).length===1,'日志未发布');savedId=uid});
await test('相同提交重试去重且回读已保存结果',async()=>{const retry={id:uid,qty:10};const result=await pmsCommitRecords([{store:S.pmsCommittedOperations,value:retry}],{log,operationId:uid+'-operation',attachments:[file],attachmentReferences:[{store:S.pmsCommittedOperations,key:uid,fileIds:[file.id]}]});assert(result.replayed&&retry.qty===10,'重复写入');assert(listPmsLogs(log.objectType,uid).length===1,'重复日志')});
await test('同一提交改业务内容必须冲突，不能旧值冒充新保存',async()=>{const changed={id:uid,qty:99};let failed=false;try{await pmsCommitRecords([{store:S.pmsCommittedOperations,value:changed}],{log,operationId:uid+'-operation',attachments:[file],attachmentReferences:[{store:S.pmsCommittedOperations,key:uid,fileIds:[file.id]}]})}catch(e){failed=e.code==='PMS_IDB_OPERATION_CONFLICT'}assert(failed,'错误回读旧值作为新保存');assert(changed.qty===99,'输入被覆盖');assert((await pmsGet(S.pmsCommittedOperations,uid)).qty===10,'改变持久原值')});
await test('同名同大小文件改字节不能冒用旧提交成功',async()=>{const changed={id:uid,qty:10};let failed=false;try{await pmsCommitRecords([{store:S.pmsCommittedOperations,value:changed}],{log,operationId:uid+'-operation',attachments:[{...file,blob:new Blob(['DIFF'],{type:'text/plain'})}],attachmentReferences:[{store:S.pmsCommittedOperations,key:uid,fileIds:[file.id]}]})}catch(e){failed=e.code==='PMS_IDB_OPERATION_CONFLICT'}assert(failed,'同大小不同字节错误回读旧成功');assert(await(await pmsGet(S.pmsAttachments,file.id)).blob.text()==='TEST','原字节被改变')});
await test('版本冲突不改变原记录/附件/日志或候选版本',async()=>{const stale={id:uid,qty:25,_pmsBaseVersion:0};const logs=listPmsLogs(log.objectType,uid).length;let failed=false;try{await pmsCommitRecords([{store:S.pmsCommittedOperations,value:stale}],{log,attachments:[{...file,id:uid+'-rejected'}],attachmentReferences:[{store:S.pmsCommittedOperations,key:uid,fileIds:[uid+'-rejected']}]})}catch(e){failed=e.code==='PMS_IDB_VERSION_CONFLICT'}assert(failed,'未识别冲突');assert(stale.qty===25&&stale._pmsBaseVersion===0,'候选输入被改变');assert((await pmsGet(S.pmsCommittedOperations,uid)).qty===10,'原记录被改变');assert(!await pmsGet(S.pmsAttachments,uid+'-rejected'),'半套附件');assert(listPmsLogs(log.objectType,uid).length===logs,'发布未保存日志')});
await test('事务中止无半套数据且请求成功不视为完成',async()=>{let failed=false;try{await pmsTx(S.pmsCommittedOperations,'readwrite',tx=>new Promise((resolve,reject)=>{const r=tx.objectStore(S.pmsCommittedOperations).put({id:uid+'-abort'});r.onsuccess=()=>{tx.abort();resolve()}}))}catch(e){failed=true}assert(failed,'假成功');assert(!await pmsGet(S.pmsCommittedOperations,uid+'-abort'),'中止残留')});
await test('首次检查前后无整批静态种子落盘',async()=>{const db=await getPmsDb();for(const name of [S.pmsSuppliers,S.pmsProductPurchaseOrders,S.pmsKolStock,S.pmsFittingTimeliness])assert((await pmsAll(name)).length===0,name+'发生种子写入');assert(![...db.objectStoreNames].includes('pmsBomTemplates'),'新库创建退休对象')});
await test('复制复用附件字节，有引用不误删、无引用可回收',async()=>{const copy={id:uid+'-copy',qty:10};await pmsCommitRecords([{store:S.pmsCommittedOperations,value:copy}],{attachmentReferences:[{store:S.pmsCommittedOperations,key:copy.id,fileIds:[file.id]}]});assert((await pmsGet(S.pmsAttachments,file.id)).size===4,'复制新增字节');const first={...main,qty:10};await pmsCommitRecords([{store:S.pmsCommittedOperations,value:first}],{attachmentReferences:[{store:S.pmsCommittedOperations,key:uid,fileIds:[]}],attachmentDeletes:[file.id]});assert(await pmsGet(S.pmsAttachments,file.id),'误删仍引用附件');const second={...copy,qty:10};await pmsCommitRecords([{store:S.pmsCommittedOperations,value:second}],{attachmentReferences:[{store:S.pmsCommittedOperations,key:copy.id,fileIds:[]}],attachmentDeletes:[file.id]});assert(!await pmsGet(S.pmsAttachments,file.id),'无引用附件未回收');await pmsCommitRecords([{store:S.pmsCommittedOperations,value:first}],{attachments:[file],attachmentReferences:[{store:S.pmsCommittedOperations,key:uid,fileIds:[file.id]}]});main._pmsBaseVersion=first._pmsBaseVersion});
await test('缺失文件引用中止全部关联记录并保留输入',async()=>{const candidate={id:uid+'-missing',qty:20};let failed=false;try{await pmsCommitRecords([{store:S.pmsCommittedOperations,value:candidate}],{attachmentReferences:[{store:S.pmsCommittedOperations,key:candidate.id,fileIds:[uid+'-absent']}]})}catch(e){failed=e.code==='PMS_IDB_ATTACHMENT_MISSING'}assert(failed,'未识别缺文件');assert(!await pmsGet(S.pmsCommittedOperations,candidate.id),'半套业务记录');assert(candidate.qty===20,'输入丢失')});
await test('IndexedDB不可用时明确失败而非返回保存成功',async()=>{closePmsDb();const descriptor=Object.getOwnPropertyDescriptor(globalThis,'indexedDB');Object.defineProperty(globalThis,'indexedDB',{value:undefined,configurable:true});let failed=false;try{await pmsPut(S.pmsCommittedOperations,{id:uid+'-unavailable'})}catch(e){failed=e.code==='PMS_IDB_UNAVAILABLE'}finally{Object.defineProperty(globalThis,'indexedDB',descriptor)}assert(failed,'吞掉保存失败')});
output.dataset.complete='true';output.dataset.result=report.every(x=>x.result==='通过')?'passed':'failed';document.querySelector('#run').disabled=false};
let receivedBackup=null;
window.addEventListener('message',event=>{if(event.origin!=='http://127.0.0.1:5250'||!event.data?.backup)return;receivedBackup=event.data.backup;document.querySelector('#restore').disabled=false;output.textContent='已收到原始记录及附件备份，尚未恢复';});
document.querySelector('#backup').onclick=async()=>{report=[];await test('完整备份包含原始Blob且冲突恢复不改变现存数据',async()=>{const before=await pmsAll(S.pmsCommittedOperations);const bundle=await exportPmsDataBundle();assert(bundle.bytes>12,'备份为空');const bytes=new Uint8Array(await bundle.blob.slice(0,12).arrayBuffer());assert(new TextDecoder().decode(bytes.slice(0,8))==='HGPMS001','备份头不同');let rejected=false;try{await importPmsDataBundle(bundle.blob)}catch(e){rejected=e.code==='PMS_IDB_IMPORT_CONFLICT'}assert(rejected,'有重复附件未拒绝');assert(JSON.stringify(await pmsAll(S.pmsCommittedOperations))===JSON.stringify(before),'失败改变原数据')});await test('错误格式恢复不改任何原记录',async()=>{const before=await pmsAll(S.pmsCommittedOperations);let rejected=false;try{await importPmsDataBundle(new Blob(['INVALID BACKUP']))}catch(e){rejected=true}assert(rejected,'未拒绝错误格式');assert(JSON.stringify(await pmsAll(S.pmsCommittedOperations))===JSON.stringify(before),'失败改变原数据')});output.dataset.complete='true'};
document.querySelector('#transfer').onclick=async()=>{const frame=document.createElement('iframe');frame.style='width:100%;height:450px;border:2px solid #777';frame.src='http://127.0.0.1:5253/pms-storage-checks.html?restore=1';document.querySelector('#target').replaceChildren(frame);frame.onload=async()=>{const bundle=await exportPmsDataBundle();frame.contentWindow.postMessage({backup:bundle.blob},'http://127.0.0.1:5253')};};
document.querySelector('#restore').onclick=async()=>{report=[];await test('另一隔离域完整恢复并回读所有原始附件',async()=>{assert(receivedBackup,'备份未读入');const result=await importPmsDataBundle(receivedBackup);const files=await pmsAll(S.pmsAttachments);assert(result.imported>0,'未恢复记录');assert(files.length>0,'缺附件');for(const file of files)assert(await file.blob.text()==='TEST','恢复文件字节不一致');assert((await pmsAll(S.pmsAttachmentReferences)).every(ref=>ref.fileIds.every(id=>files.some(file=>file.id===id))),'引用不完整')});output.dataset.complete='true';output.dataset.result=report.every(x=>x.result==='通过')?'passed':'failed'};
document.querySelector('#upgrade').onclick=async()=>{report=[];await test('版本1升级、旧记录保留与阻塞后关闭旧连接恢复',async()=>{const existing=await indexedDB.databases();assert(!existing.some(db=>db.name===PMS_IDB_DB_NAME),'此域已有数据库，拒绝改动；请用新的隔离本机域');const old=await new Promise((resolve,reject)=>{const r=indexedDB.open(PMS_IDB_DB_NAME,1);r.onupgradeneeded=()=>{r.result.createObjectStore('legacyPmsFixture',{keyPath:'id'});r.result.createObjectStore(S.pmsSuppliers,{keyPath:'supplierCode'})};r.onerror=()=>reject(r.error);r.onsuccess=()=>resolve(r.result)});await new Promise((resolve,reject)=>{const tx=old.transaction(['legacyPmsFixture',S.pmsSuppliers],'readwrite');tx.objectStore('legacyPmsFixture').put({id:'CHECK-legacy',value:12});tx.objectStore(S.pmsSuppliers).put({supplierCode:'CHECK-upgrade',supplierName:'升级验证'});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});let blocked=false;try{await getPmsDb()}catch(e){blocked=e.code==='PMS_IDB_BLOCKED'}assert(blocked,'旧连接未触发阻塞提示');old.close();const db=await getPmsDb();assert(db.version===PMS_IDB_VERSION,'未升级到当前版本');assert((await pmsGet(S.pmsSuppliers,'CHECK-upgrade')).supplierName==='升级验证','旧记录丢失');await new Promise((resolve,reject)=>{const tx=db.transaction('legacyPmsFixture','readonly');const r=tx.objectStore('legacyPmsFixture').get('CHECK-legacy');r.onsuccess=()=>{try{assert(r.result.value===12,'旧域数据丢失');resolve()}catch(e){reject(e)}};r.onerror=()=>reject(r.error)});assert(db.objectStoreNames.contains(S.pmsAttachments),'新增附件库缺失')});output.dataset.complete='true'};
document.querySelector('#read').onclick=async()=>{closePmsDb();await test('关闭连接重开与独立持久读回',async()=>{const id=savedId||new URLSearchParams(location.search).get('id');assert(id,'没有待读记录');const saved=await pmsGet(S.pmsCommittedOperations,id);assert(saved?.qty===10&&saved._pmsBaseVersion>=1,'记录读回不同');const file=await pmsGet(S.pmsAttachments,id+'-file');assert(await file.blob.text()==='TEST','附件重开不一致');output.dataset.savedId=id});output.dataset.complete='true'};
</script>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/placeholder.svg" />
    <title>HiGood - Vanilla TypeScript Clone</title>
    <script type="module">
      // Load the requested DDS page concurrently with the shell, within the same cold navigation.
      if (/^\/dds\/supply-chain\/production-fulfillment(?:\/|$)/.test(location.pathname)) {
        import('/src/pages/production-fulfillment/index.ts');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      if (/^\/pcs\/products\/styles\/[^/]+\/technical-data\/[^/]+$/.test(window.location.pathname)) {
        void import('/src/pages/tech-pack/core.ts')
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
